<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">SovaV2 proposed logical entity map</title>
<desc id="desc">Nineteen core entities grouped into clients, API, system foundations, execution and data, and models. Speech recognition and synthesis are optional. Internal modules can share one application process in a single ordinary Linux user instance.</desc>
